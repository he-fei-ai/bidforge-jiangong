[pytest]
asyncio_mode = auto
# pytest-asyncio 1.x 起不再默认为异步 fixture 设置 loop 作用域，
# 未显式声明会触发 PytestDeprecationWarning；设为 function 与当前行为等价。
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 禁用 cacheprovider：项目内 .pytest_cache 长期被 Windows 僵尸进程 / ACL 卡住
# （2026-09-26 WinError 183 无法创建 cache path），本项目不依赖 nodeids/lastfailed，
# 直接关掉该内置插件最干净；CI 也不产生无用产物。
addopts = -p no:cacheprovider -v --tb=short
markers =
    source_lock: 锁定源码文本/结构的护栏测试（重构时需同步更新，不得滥用）
    integration: 需要真实文件、外部进程或长耗时的集成测试
    slow: 仅夜间/全量回归执行，PR 快车道跳过